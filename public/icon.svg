<svg id="appIconSvg" width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-64 h-64 sm:w-80 sm:h-80 lg:w-[384px] lg:h-[384px] rounded-[22.5%] shadow-2xl transition-all duration-300">
          <defs>
            <!-- Background Radial Gradient -->
            <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#2a1f10"/>
              <stop offset="60%" stop-color="#0f0c08"/>
              <stop offset="100%" stop-color="#050403"/>
            </radialGradient>

            <!-- Outer Shield Metallic Gradient -->
            <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fef08a"/>
              <stop offset="25%" stop-color="#d97706"/>
              <stop offset="50%" stop-color="#78350f"/>
              <stop offset="75%" stop-color="#b45309"/>
              <stop offset="100%" stop-color="#fef08a"/>
            </linearGradient>

            <!-- Inner Shield Gold Gradient -->
            <linearGradient id="shieldFillGrad" x1="50%" y1="0%" x2="50%" y2="100%">
              <stop offset="0%" stop-color="#92400e"/>
              <stop offset="30%" stop-color="#d97706"/>
              <stop offset="65%" stop-color="#78350f"/>
              <stop offset="100%" stop-color="#1c0d02"/>
            </linearGradient>

            <!-- Oak Emblem Gold Fill Gradient -->
            <linearGradient id="leafGrad" x1="20%" y1="0%" x2="80%" y2="100%">
              <stop offset="0%" stop-color="#fef9c3"/>
              <stop offset="40%" stop-color="#f59e0b"/>
              <stop offset="80%" stop-color="#b45309"/>
              <stop offset="100%" stop-color="#451a03"/>
            </linearGradient>

            <!-- Highlight Light Arc -->
            <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
              <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
            </linearGradient>

            <!-- Inner Bevel Shadow -->
            <radialGradient id="innerBevel" cx="50%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
              <stop offset="70%" stop-color="#000000" stop-opacity="0.7"/>
            </radialGradient>

            <!-- Drop Shadows -->
            <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
              <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#d97706" flood-opacity="0.3"/>
            </filter>

            <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.9"/>
              <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4"/>
            </filter>

            <filter id="glowEffect">
              <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>

          <!-- 1. Background Base -->
          <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
          
          <!-- Decorative Outer Vignette / Border -->
          <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="#d97706" stroke-opacity="0.15" stroke-width="2"/>

          <!-- Background Subtle Sparks / Golden Dust -->
          <circle cx="100" cy="90" r="1.5" fill="#fef08a" opacity="0.4"/>
          <circle cx="420" cy="110" r="2" fill="#fef08a" opacity="0.3"/>
          <circle cx="80" cy="380" r="1" fill="#fef08a" opacity="0.3"/>
          <circle cx="430" cy="400" r="1.5" fill="#fef08a" opacity="0.5"/>
          <circle cx="256" cy="45" r="2.5" fill="#fef08a" opacity="0.6" filter="url(#glowEffect)"/>

          <!-- 2. Shield Group -->
          <g filter="url(#shieldShadow)">
            <!-- Outer Gold Metallic Shield Rim -->
            <path d="M 256,70 &#10;                     C 320,68 375,85 400,105&#10;                     C 400,240 375,340 256,432&#10;                     C 137,340 112,240 112,105&#10;                     C 137,85 192,68 256,70 Z" fill="url(#goldBorderGrad)"/>

            <!-- Shield Rim Inner Groove Cut -->
            <path d="M 256,82 &#10;                     C 313,80 362,95 385,113&#10;                     C 385,232 362,322 256,412&#10;                     C 150,322 127,232 127,113&#10;                     C 150,95 199,80 256,82 Z" fill="#000000" opacity="0.6"/>

            <!-- Shield Main Inner Face -->
            <path d="M 256,86 &#10;                     C 310,84 357,98 380,116&#10;                     C 380,230 357,317 256,405&#10;                     C 155,317 132,230 132,116&#10;                     C 155,98 202,84 256,86 Z" fill="url(#shieldFillGrad)"/>

            <!-- Inner Face Light Shadow / Bevel Layer -->
            <path d="M 256,86 &#10;                     C 310,84 357,98 380,116&#10;                     C 380,230 357,317 256,405&#10;                     C 155,317 132,230 132,116&#10;                     C 155,98 202,84 256,86 Z" fill="url(#innerBevel)"/>

            <!-- Shield Top Highlight Metallic Sheen -->
            <path d="M 256,86 &#10;                     C 310,84 357,98 380,116&#10;                     C 380,200 340,260 256,280&#10;                     C 180,250 132,180 132,116&#10;                     C 155,98 202,84 256,86 Z" fill="url(#highlightGrad)" opacity="0.4"/>
          </g>

          <!-- 3. Central Medieval Emblem (Stylized Golden Oak Leaf / Crest) -->
          <g filter="url(#leafShadow)">
            <!-- Main Oak Leaf Motif Path (Accurately inspired by the user's reference) -->
            <path d="M 256,145 &#10;                     C 264,162 278,165 288,158&#10;                     C 285,175 298,182 310,180&#10;                     C 298,198 305,212 322,218&#10;                     C 305,232 308,252 318,268&#10;                     C 300,270 292,285 296,305&#10;                     C 280,298 268,308 266,335&#10;                     L 256,365&#10;                     L 246,335&#10;                     C 244,308 232,298 216,305&#10;                     C 220,285 212,270 194,268&#10;                     C 204,252 207,232 190,218&#10;                     C 207,212 214,198 202,180&#10;                     C 214,182 227,175 224,158&#10;                     C 234,165 248,162 256,145 Z" fill="url(#leafGrad)" stroke="#fef08a" stroke-width="2.5" stroke-linejoin="round"/>

            <!-- Oak Leaf Central Vein / Spine Lines -->
            <path d="M 256,165 L 256,350" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
            <path d="M 256,200 L 285,188" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
            <path d="M 256,205 L 227,193" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
            <path d="M 256,240 L 292,228" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
            <path d="M 256,245 L 220,233" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
            <path d="M 256,280 L 282,272" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
            <path d="M 256,285 L 230,277" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
          </g>

          <!-- Golden Corner Accents for PWA Aesthetic -->
          <circle cx="256" cy="118" r="3" fill="#fef08a" opacity="0.8"/>
          <circle cx="256" cy="385" r="3.5" fill="#fef08a" opacity="0.8"/>
        </svg>